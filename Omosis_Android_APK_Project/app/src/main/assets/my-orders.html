<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders — Omosis</title><link rel="stylesheet" href="css/style.css"></head><body><div class="topbar">Local finds. Simple shopping. <b>Cash on Delivery available</b></div><header><div class="wrap nav"><a class="brand" href="index.html"><span class="logo">O</span>Omosis</a><nav class="navlinks"><a href="products.html">Products</a><a href="my-orders.html">My Orders</a><a href="help.html">Help</a></nav><div class="nav-actions"><a class="btn outline" data-auth-nav href="login.html">Login</a><a class="btn primary" href="cart.html">Bag <span data-cart-count>0</span></a></div></div></header><main><section class="page-hero"><div class="wrap card"><div class="eyebrow">Account</div><h2>My Orders</h2><p class="muted">Your COD orders and latest delivery status.</p></div></section><section class="section"><div class="wrap" id="ordersList"><div class="card">Loading orders…</div></div></section></main><footer><div class="wrap"><div class="legal">© <span data-year></span> Omosis.</div></div></footer><script src="js/products.js"></script><script src="js/app.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js"></script><script src="js/orders.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{const u=await currentUser();if(!u){location.href='login.html?next=my-orders.html';return}const box=qs('#ordersList');try{const {orders}=await getMyOrders();if(!orders.length){box.innerHTML='<div class="card empty">No orders yet. <a href="products.html"><b>Start shopping</b></a></div>';return}box.innerHTML=orders.map(o=>`<article class="card order-card"><div class="order-head"><div><div class="eyebrow">${escapeHtml(o.order_number)}</div><h3>${new Date(o.created_at).toLocaleString()}</h3></div><span class="${statusClass(o.status)}">${escapeHtml(o.status)}</span></div><p class="muted">${o.order_items.map(i=>escapeHtml(i.product_name)+' × '+i.quantity).join(' • ')}</p><div class="summary-line total"><span>Total</span><span>${money(Number(o.total))}</span></div><a class="btn outline" href="track-order.html?id=${encodeURIComponent(o.order_number)}">Track order</a></article>`).join('')}catch(e){box.innerHTML='<div class="card notice">Could not load orders: '+escapeHtml(e.message)+'. Make sure you ran supabase-orders-setup.sql in Supabase.</div>'}});</script><script src="js/android-bridge.js"></script></body></html>
