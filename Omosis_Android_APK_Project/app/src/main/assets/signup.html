<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6442de"><title>Sign up — Omosis</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div class="topbar">Local finds. Simple shopping. <b>Cash on Delivery available</b></div><header><div class="wrap nav"><a class="brand" href="index.html"><span class="logo">O</span>Omosis</a><nav class="navlinks"><a href="products.html">Products</a><a href="categories.html">Categories</a><a href="deals.html">Deals</a><a href="sellers.html">For sellers</a><a href="help.html">Help</a></nav><div class="nav-actions"><a class="btn outline" data-auth-nav href="login.html">Login</a><a class="btn soft" href="account.html">Account</a><a class="btn primary" href="cart.html">Bag <span data-cart-count>0</span></a></div></div></header><main><section class="page-hero"><div class="wrap card" style="max-width:620px"><div class="eyebrow">Join Omosis</div><h2>Create your account</h2><p class="muted">Sign up with your email and password.</p><form id="signupForm" class="form-grid" style="margin-top:24px"><input class="field full" name="name" autocomplete="name" required placeholder="Your name"><input class="field full" type="email" name="email" autocomplete="email" required placeholder="Email address"><input class="field full" type="password" name="password" autocomplete="new-password" minlength="6" required placeholder="Password (6+ characters)"><button id="signupSubmit" class="btn primary full" type="submit">Create account</button><p id="authMessage" class="form-note full"></p></form><p class="muted">Already registered? <a href="login.html" style="color:var(--purple);font-weight:800">Login</a></p></div></section></main><footer><div class="wrap"><div class="legal">© <span data-year></span> Omosis. Local marketplace.</div></div></footer><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/products.js"></script><script src="js/app.js"></script><script src="js/auth.js"></script><script>document.getElementById('signupForm').addEventListener('submit', async (e)=>{e.preventDefault();const b=document.getElementById('signupSubmit'),m=document.getElementById('authMessage');b.disabled=true;b.textContent='Creating account...';m.textContent='';const name=e.target.name.value.trim(),email=e.target.email.value.trim(),password=e.target.password.value;if(password.length<6){m.textContent='Use a password with at least 6 characters.';b.disabled=false;b.textContent='Create account';return;}const {data,error}=await omosisSupabase.auth.signUp({email,password,options:{data:{name},emailRedirectTo:new URL('account.html',location.href).href}});if(error){m.textContent=error.message;b.disabled=false;b.textContent='Create account';return;}if(data.session){location.href='account.html';}else{m.textContent='Account created. Check your email and confirm your address, then log in.';b.disabled=false;b.textContent='Create account';}});</script><script src="js/android-bridge.js"></script></body></html>
