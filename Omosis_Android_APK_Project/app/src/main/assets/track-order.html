<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order — Omosis</title><link rel="stylesheet" href="css/style.css"></head><body><div class="topbar">Local finds. Simple shopping. <b>Cash on Delivery available</b></div><header><div class="wrap nav"><a class="brand" href="index.html"><span class="logo">O</span>Omosis</a><div class="nav-actions"><a class="btn outline" href="my-orders.html">My Orders</a><a class="btn primary" href="products.html">Shop</a></div></div></header><main><section class="page-hero"><div class="wrap card"><div class="eyebrow">Orders</div><h2>Track your order</h2><p class="muted">Live status from your Omosis account.</p></div></section><section class="section"><div class="wrap"><div class="card" id="track">Loading…</div></div></section></main><script src="js/products.js"></script><script src="js/app.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js"></script><script src="js/orders.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{const u=await currentUser();if(!u){location.href='login.html?next='+encodeURIComponent('track-order.html'+location.search);return}const id=new URLSearchParams(location.search).get('id');const box=qs('#track');let q=omosisSupabase.from('orders').select('*,order_items(*)').eq('user_id',u.id).order('created_at',{ascending:false}).limit(1);if(id)q=omosisSupabase.from('orders').select('*,order_items(*)').eq('user_id',u.id).eq('order_number',id).limit(1);const {data,error}=await q;if(error){box.innerHTML='<div class="notice">'+escapeHtml(error.message)+'</div>';return}const o=data&&data[0];if(!o){box.innerHTML='<div class="empty">No matching order found.</div>';return}box.innerHTML=`<div class="order-head"><div><div class="eyebrow">Order</div><h2>${escapeHtml(o.order_number)}</h2></div><span class="${statusClass(o.status)}">${escapeHtml(o.status)}</span></div><div class="status-steps">${['Pending','Confirmed','Shipped','Delivered'].map((s,i)=>`<div class="status-step ${['Pending','Confirmed','Shipped','Delivered'].indexOf(o.status)>=i?'done':''}"><b>${s}</b></div>`).join('')}</div><p class="muted">${o.order_items.map(i=>escapeHtml(i.product_name)+' × '+i.quantity).join('<br>')}</p><div class="summary-line total"><span>Total</span><span>${money(Number(o.total))}</span></div>${o.status==='Cancelled'?'<div class="notice">This order was cancelled.</div>':''}`});</script><script src="js/android-bridge.js"></script></body></html>
