<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Orders — Omosis</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="topbar">Omosis <b>Admin</b></div><header><div class="wrap nav"><a class="brand" href="../index.html"><span class="logo">O</span>Omosis</a><div class="nav-actions"><a class="btn outline" href="../account.html">Account</a><a class="btn primary" href="../index.html">Store</a></div></div></header><main><section class="page-hero"><div class="wrap card"><div class="eyebrow">Admin</div><h2>Order management</h2><p class="muted">Update COD order status. This page only works for an account with the admin role.</p></div></section><section class="section"><div class="wrap"><div id="adminMsg" class="card">Checking admin access…</div><div id="adminOrders" class="table-wrap" style="margin-top:18px"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/products.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script><script src="../js/orders.js"></script><script>
const statuses=['Pending','Confirmed','Shipped','Delivered','Cancelled'];
async function loadAdmin(){const u=await currentUser(),msg=document.getElementById('adminMsg'),box=document.getElementById('adminOrders');if(!u){location.href='../login.html?next='+encodeURIComponent('admin/orders.html');return}const {data:p,error:pe}=await omosisSupabase.from('profiles').select('role').eq('id',u.id).single();if(pe||!p||p.role!=='admin'){msg.innerHTML='<b>Admin access not enabled.</b><p class="muted">Run the admin-role UPDATE statement from supabase-orders-setup.sql using your login email.</p>';return}msg.innerHTML='<b>Admin access active.</b> <span class="muted">Orders below are live from Supabase.</span>';const {data,error}=await omosisSupabase.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});if(error){box.innerHTML='<div class="card notice">'+escapeHtml(error.message)+'</div>';return}box.innerHTML=!data.length?'<div class="card empty">No orders yet.</div>':`<table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Update</th></tr></thead><tbody>${data.map(o=>`<tr><td><b>${escapeHtml(o.order_number)}</b><br><small>${new Date(o.created_at).toLocaleString()}</small></td><td>${escapeHtml(o.customer_name)}<br><small>${escapeHtml(o.phone)}<br>${escapeHtml(o.city)}, ${escapeHtml(o.state)} ${escapeHtml(o.pincode)}</small></td><td>${o.order_items.map(i=>escapeHtml(i.product_name)+' × '+i.quantity).join('<br>')}</td><td>${money(Number(o.total))}</td><td><span class="${statusClass(o.status)}">${escapeHtml(o.status)}</span></td><td><select class="field status-select" data-id="${o.id}">${statuses.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>`;document.querySelectorAll('.status-select').forEach(s=>s.addEventListener('change',async e=>{e.target.disabled=true;const {error}=await omosisSupabase.from('orders').update({status:e.target.value,updated_at:new Date().toISOString()}).eq('id',e.target.dataset.id);e.target.disabled=false;if(error)alert(error.message);else loadAdmin()}))}
document.addEventListener('DOMContentLoaded',loadAdmin);</script><script src="../js/android-bridge.js"></script></body></html>
