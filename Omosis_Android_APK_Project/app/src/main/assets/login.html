<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6442de"><title>Login — Omosis</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div class="topbar">Local finds. Simple shopping. <b>Cash on Delivery available</b></div><header><div class="wrap nav"><a class="brand" href="index.html"><span class="logo">O</span>Omosis</a><nav class="navlinks"><a href="products.html">Products</a><a href="categories.html">Categories</a><a href="deals.html">Deals</a><a href="sellers.html">For sellers</a><a href="help.html">Help</a></nav><div class="nav-actions"><a class="btn outline" data-auth-nav href="login.html">Login</a><a class="btn soft" href="account.html">Account</a><a class="btn primary" href="cart.html">Bag <span data-cart-count>0</span></a></div></div></header><main><section class="page-hero"><div class="wrap card" style="max-width:620px"><div class="eyebrow">Welcome back</div><h2>Login to Omosis</h2><p class="muted">Access your account and future order history.</p><form id="loginForm" class="form-grid" style="margin-top:24px"><input class="field full" type="email" name="email" autocomplete="email" required placeholder="Email address"><input class="field full" type="password" name="password" autocomplete="current-password" required placeholder="Password"><button id="loginSubmit" class="btn primary full" type="submit">Login</button><p id="authMessage" class="form-note full"></p></form><p class="muted">New to Omosis? <a href="signup.html" style="color:var(--purple);font-weight:800">Create account</a></p></div></section></main><footer><div class="wrap"><div class="legal">© <span data-year></span> Omosis. Local marketplace.</div></div></footer><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/products.js"></script><script src="js/app.js"></script><script src="js/auth.js"></script><script>document.getElementById('loginForm').addEventListener('submit', async (e)=>{e.preventDefault();const b=document.getElementById('loginSubmit'),m=document.getElementById('authMessage');b.disabled=true;b.textContent='Signing in...';m.textContent='';const email=e.target.email.value.trim();const password=e.target.password.value;const {error}=await omosisSupabase.auth.signInWithPassword({email,password});if(error){m.textContent=error.message;b.disabled=false;b.textContent='Login';return;}const next=new URLSearchParams(location.search).get('next');location.href=next||'account.html';});currentUser().then(u=>{if(u) document.getElementById('authMessage').textContent='You are already signed in as '+u.email;});</script><script src="js/android-bridge.js"></script></body></html>
